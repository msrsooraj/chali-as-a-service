<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Random Malayalam jokes and memes served fresh — Chali as a Service.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Chali as a Service{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Your daily dose of Malayalam humour, one random chali at a time.{% endblock %}">
    <meta property="og:type" content="website">
    <title>{% block title %}Chali as a Service{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f7fb;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            width: 100%;
        }

        /* Card (homepage) */
        .card {
            background: white;
            padding: 32px;
            max-width: 600px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .joke {
            font-size: 1.4rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #1a1a1a;
        }

        .card img {
            max-width: 100%;
            border-radius: 12px;
        }

        .feedback-btn {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        button, .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #222;
            color: white;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover, .btn:hover {
            background: #444;
        }

        /* Content pages */
        .content-page {
            background: white;
            padding: 36px 32px;
            max-width: 660px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: left;
        }

        .content-page h1 {
            margin-top: 0;
            font-size: 1.4rem;
            color: #1a1a1a;
        }

        .content-page h2 {
            font-size: 1rem;
            margin-top: 24px;
            margin-bottom: 8px;
            color: #333;
        }

        .content-page p, .content-page li {
            font-size: 0.92rem;
            line-height: 1.7;
            color: #444;
        }

        .content-page ul {
            padding-left: 20px;
        }

        .content-page a {
            color: #3b82f6;
            text-decoration: none;
        }

        .content-page a:hover {
            text-decoration: underline;
        }

        .content-page .updated {
            font-size: 0.82rem;
            color: #999;
            margin-top: -4px;
        }

        .content-page code {
            background: #f6f7fb;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88rem;
        }

        /* Footer */
        footer {
            width: 100%;
            text-align: center;
            padding: 20px 16px 28px;
            font-size: 0.82rem;
            color: #999;
        }

        footer a {
            color: #777;
            text-decoration: none;
            margin: 0 10px;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #333;
            text-decoration: underline;
        }

        footer .separator {
            color: #ccc;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 14px;
            max-width: 500px;
            width: 100%;
            position: relative;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 12px;
        }

        .close {
            position: absolute;
            top: 12px;
            right: 16px;
            cursor: pointer;
            font-size: 1.2rem;
            color: #666;
            z-index: 10;
        }

        .close:hover {
            color: #000;
        }

        /* Ad container */
        .ad-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px 20px;
            text-align: center;
        }

        .ad-container ins {
            border-radius: 12px;
            overflow: hidden;
        }

        {% block extra_styles %}{% endblock %}
    </style>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7148483459385293"
            crossorigin="anonymous"></script>
</head>
<body>

    {% block body %}{% endblock %}

    <footer>
        <a href="{{ url_for('chali') }}">Home</a>
        <span class="separator">&middot;</span>
        <a href="{{ url_for('about') }}">About</a>
        <span class="separator">&middot;</span>
        <a href="{{ url_for('privacy') }}">Privacy</a>
        <span class="separator">&middot;</span>
        <a href="{{ url_for('terms') }}">Terms</a>
        <span class="separator">&middot;</span>
        <a href="{{ url_for('contact') }}">Contact</a>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
