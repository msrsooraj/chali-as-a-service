<!DOCTYPE html>
<html>
<head>
    <title>Chali as a Service</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f6f7fb;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            padding: 30px;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        .joke {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            border-radius: 12px;
        }
        .feedback-btn {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }
        button {
            padding: 10px 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #222;
            color: white;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 14px;
            max-width: 500px;
            position: relative;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 14px;
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="joke">😂 {{ quote }}</div>
    <img src="{{ image_url }}" alt="Dad meme">

    <div class="feedback-btn">
        <button onclick="openModal()">Give Feedback</button>
    </div>
</div>

<div class="modal" id="feedbackModal">
    <div class="modal-content">
        <div class="close" onclick="closeModal()">✖</div>
        <img src="{{ feedback_image }}" alt="Feedback meme">
    </div>
</div>

<script>
    function openModal() {
        document.getElementById("feedbackModal").style.display = "flex";
    }
    function closeModal() {
        document.getElementById("feedbackModal").style.display = "none";
    }
</script>

</body>
</html>
